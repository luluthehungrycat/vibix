name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C code-model=kernel"

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq nasm qemu-system-x86 qemu-kvm

    - name: Install Rust
      run: |
        rustup show
        rustup target add x86_64-unknown-none

    - name: Build kernel
      run: make

    - name: Run tests
      run: make test
